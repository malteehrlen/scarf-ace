<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Scarf Ace app icon: a script page (screenplay line layout) with a spade, like an ace card. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9563d"/>
      <stop offset="1" stop-color="#a23b27"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a1a0e" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="118" y="78" width="276" height="356" rx="26" fill="#fffdf9"/>
  </g>
  <!-- Screenplay lines: scene heading, action, centered cue, indented dialogue -->
  <g fill="#3a2e2a">
    <rect x="152" y="124" width="150" height="18" rx="9"/>
  </g>
  <g fill="#b9aca6">
    <rect x="152" y="168" width="208" height="13" rx="6.5"/>
    <rect x="152" y="193" width="176" height="13" rx="6.5"/>
  </g>
  <g fill="#3a2e2a">
    <rect x="226" y="236" width="62" height="14" rx="7"/>
  </g>
  <g fill="#b9aca6">
    <rect x="194" y="262" width="128" height="13" rx="6.5"/>
    <rect x="194" y="287" width="100" height="13" rx="6.5"/>
  </g>
  <!-- The ace: a spade in the page's corner -->
  <path fill="#b5452f" transform="translate(330 362) scale(1.05)"
        d="M0 -40 C 22 -18, 44 -4, 44 16 C 44 33, 27 42, 10 33 L 15 52 L -15 52 L -10 33 C -27 42, -44 33, -44 16 C -44 -4, -22 -18, 0 -40 Z"/>
</svg>
