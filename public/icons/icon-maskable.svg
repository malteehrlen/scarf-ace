      <rect x="194" y="262" width="128" height="13" rx="6.5"/>
      <rect x="194" y="287" width="100" height="13" rx="6.5"/>
    </g>
    <rect x="226" y="236" width="62" height="14" rx="7" fill="#3a2e2a"/>
    <path fill="#b5452f" transform="translate(330 362) scale(1.05)"
