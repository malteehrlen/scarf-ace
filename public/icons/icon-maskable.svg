  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <rect x="118" y="78" width="276" height="356" rx="26" fill="#fffdf9"/>
    <rect x="152" y="124" width="150" height="18" rx="9" fill="#3a2e2a"/>
